name: Gitflow guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: gitflow-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-branch-flow:
    name: Validate branch flow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate pull request origin and destination
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_REPOSITORY" != "$THIS_REPOSITORY" ]]; then
            echo "Pull requests must originate in the canonical repository." >&2
            exit 1
          fi

          case "$BASE_BRANCH" in
            release/*)
              if [[ ! "$BASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Release branches must use release/X.Y.Z." >&2
                exit 1
              fi
              if [[ ! "$HEAD_BRANCH" =~ ^(feature|fix|docs|hotfix)/.+$ ]]; then
                echo "Only feature, fix, docs, or hotfix branches may target a release branch." >&2
                exit 1
              fi
              ;;
            master)
              if [[ ! "$HEAD_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Only a versioned release branch may target master." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported pull request target: $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

          echo "Branch flow accepted: $HEAD_BRANCH -> $BASE_BRANCH"

  validate-change-metadata:
    name: Validate change metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep this check limited to the PR title; the release publication
          # workflow will validate the complete commit range separately.
          conventional_commit_regex='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\([^)]*\))?!?:[[:space:]].+'
          if [[ ! "$PR_TITLE" =~ $conventional_commit_regex ]]; then
            echo "PR title must follow Conventional Commits." >&2
            exit 1
          fi

  publish-release:
    name: Publish release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create immutable tag and release
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must use release/X.Y.Z." >&2
            exit 1
          fi

          version="${RELEASE_BRANCH#release/}"
          tag="v$version"

          if [[ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]]; then
            echo "Checkout is not the pull request merge commit." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists; refusing to move or recreate it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Release $tag" "$MERGE_SHA"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes
